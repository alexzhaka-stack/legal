<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirigiendo a WhatsApp...</title>

  <!-- Redirect automático a los 2 segundos -->
  <meta http-equiv="refresh" content="2;url=https://wa.me/message/X7IMDT425DQ7L1" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #25D366;
      --green-dark: #128C7E;
      --bg: #f0f2f5;
      --text: #111;
      --muted: #666;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 4px 32px rgba(0,0,0,0.08);
    }

    .icon {
      width: 72px;
      height: 72px;
      background: var(--green);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    .icon svg {
      width: 40px;
      height: 40px;
      fill: #fff;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 8px;
    }

    p {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      background: var(--green);
      color: #fff;
      text-decoration: none;
      padding: 13px 28px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--green-dark);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(37,211,102,0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 12px rgba(37,211,102,0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <!-- WhatsApp SVG -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
        <path d="M16 2C8.268 2 2 8.268 2 16c0 2.425.638 4.7 1.757 6.668L2 30l7.558-1.726A13.93 13.93 0 0 0 16 30c7.732 0 14-6.268 14-14S23.732 2 16 2zm0 25.5a11.44 11.44 0 0 1-5.822-1.588l-.418-.248-4.487 1.025 1.065-4.363-.272-.447A11.45 11.45 0 0 1 4.5 16C4.5 9.649 9.649 4.5 16 4.5S27.5 9.649 27.5 16 22.351 27.5 16 27.5zm6.29-8.558c-.344-.172-2.037-1.004-2.352-1.118-.316-.115-.546-.172-.776.172-.23.344-.89 1.118-1.09 1.348-.2.23-.4.258-.745.086-.344-.172-1.454-.536-2.769-1.708-1.023-.912-1.713-2.037-1.913-2.382-.2-.344-.021-.53.15-.701.154-.154.344-.4.516-.601.172-.2.23-.344.344-.573.115-.23.057-.43-.029-.601-.086-.172-.776-1.87-1.063-2.562-.28-.672-.564-.58-.776-.591l-.66-.011c-.23 0-.601.086-.916.43s-1.203 1.175-1.203 2.867 1.232 3.325 1.403 3.554c.172.23 2.424 3.7 5.873 5.19.821.354 1.462.566 1.961.724.824.262 1.574.225 2.167.137.661-.099 2.037-.832 2.323-1.636.287-.804.287-1.493.2-1.636-.086-.143-.316-.23-.66-.4z"/>
      </svg>
    </div>
    <h1>Abriendo WhatsApp...</h1>
    <p>Serás redirigido automáticamente en un momento. Si no ocurre, da clic aquí:</p>
    <a class="btn" href="https://wa.me/message/X7IMDT425DQ7L1">Abrir WhatsApp</a>
  </div>
</body>
</html>
